
name: OGRRE Backend Tests

on:
  push:

defaults:
  run:
    # -l: login shell, needed when using Conda
    shell: bash -l {0}

env:
  PIP_PROGRESS_BAR: "off"

jobs:
  app-test:
    name: Test Backend Endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check secret length
        run: |
          echo "Length: ${#STAGING_ENV}"
        env:
          STAGING_ENV: ${{ secrets.STAGING_ENV }}

      - name: Create .env file from secret
        run: |
          cat << 'EOF' > ogrre/.env
          REQUIRE_AUTH=false
          ${{ secrets.STAGING_ENV }}
          STORAGE_SERVICE_KEY=storage-service-key.json
          DOCUMENT_AI_SERVICE_KEY=document-ai-service-key.json
          EOF

      - name: Install application
        run: |
          pip install .

      - name: Add storage service key json file
        id: create-storage-service-key-json
        uses: jsdaniell/create-json@v1.2.3
        with:
            name: "ogrre/storage-service-key.json"
            json: ${{ secrets.STORAGE_SERVICE_KEY_JSON }}

      - name: Add Document AI service key json file
        id: create-document-ai-service-key-json
        uses: jsdaniell/create-json@v1.2.3
        with:
            name: "ogrre/document-ai-service-key.json"
            json: ${{ secrets.DOCUMENT_AI_SERVICE_KEY_JSON }}

      - name: Run application
        run: |
          nohup python ogrre/main.py &
          sleep 15

      - name: Test that backend is up and running
        run: |
          curl -f http://localhost:8001/docs

      - name: Test get_projects
        run: |
          RESPONSE=$(curl -sSf \
            http://localhost:8001/get_projects)
      
      ## TODO: add tests for each (testable) endpoint
      ## OPTIONAL: add verification to make sure responses match expected output
