name: Trusted Terraform PR plan

# Call this workflow using @main. WIF checks job_workflow_ref so a PR cannot
# replace the trust decision below with its own credentialed implementation.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    if: >-
      vars.ENABLE_TERRAFORM_CI == 'true' && github.event_name == 'pull_request' &&
      github.repository == 'CATALOG-Historic-Records/orphaned-wells-ui-server' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_CI_BUCKET: ${{ vars.TF_CI_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_PLAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: ./.github/actions/setup-terraform
        with:
          workspace: ${{ vars.TF_WORKSPACE }}
      - run: |
          terraform -chdir=deployment/terraform fmt -check -recursive
          terraform -chdir=deployment/terraform validate
          python3 deployment/ci/terraform_ci.py plan
      # PR plans are informational only; no executable plan is uploaded.
