name: Open PRs to collaborator branches

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    if: github.repository == 'CATALOG-Historic-Records/orphaned-wells-ui-server'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate matrix from collaborators.json
        id: set-matrix
        run: |
          echo "matrix=$(jq -c . collaborators.json)" >> "$GITHUB_OUTPUT"

  sync_collaborator_branches:
    needs: setup
    if: github.repository == 'CATALOG-Historic-Records/orphaned-wells-ui-server'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
        BASE_BRANCH: ${{ matrix.base }}
    steps:
      - name: Create PR if it doesn't exist
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.BASE_BRANCH;

            const head = `${owner}:main`;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base,
              per_page: 100
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists for base=${base}`);
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              head: "main",
              base,
              title: `Sync main → ${base}`,
              body: `Automated PR created after updates to main.`,
            });
