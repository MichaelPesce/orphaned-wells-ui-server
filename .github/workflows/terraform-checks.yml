name: Deployment checks

# PR code is checked without cloud credentials, OIDC, or remote Terraform state.
on:
  pull_request:
    branches: [main]
    paths:
      - deployment/terraform/**
      - deployment/kubernetes/**
      - deployment/ci/**
      - .github/actions/setup-terraform/**
      - .github/workflows/terraform-*.yml
      - .github/workflows/deploy-k8s-*.yml

permissions:
  contents: read

concurrency:
  group: deployment-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.changes.outputs.terraform }}
      kubernetes: ${{ steps.changes.outputs.kubernetes }}
    steps:
      - name: Check out pull request and base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify Terraform and Kubernetes changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 deployment/ci/changed_paths.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  terraform:
    name: Validate Terraform configuration
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize Terraform without a backend
        uses: ./.github/actions/setup-terraform
        with:
          mode: validate
      - name: Check Terraform formatting and validate configuration
        run: |
          terraform -chdir=deployment/terraform fmt -check -recursive
          terraform -chdir=deployment/terraform validate

  kubernetes:
    name: Check Kubernetes manifest
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest validation dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Render and validate Kubernetes manifest
        run: python deployment/ci/validate_manifest.py
