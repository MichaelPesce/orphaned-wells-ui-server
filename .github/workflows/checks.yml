
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash -l {0}

env:
  PIP_PROGRESS_BAR: "off"

jobs:

  code-formatting:
    name: Check code is formatted (Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Black
        run: |
          black_requirement="$(grep '^black==' requirements-dev.txt)"
          pip --no-cache-dir install "$black_requirement"
      - name: Run Black to verify that the committed code is formatted
        run: |
          black --check .

  e2e-tests:
    name: Frontend E2E testing
    needs: code-formatting
    uses: MichaelPesce/orphaned-wells-ui/.github/workflows/frontend-tests-dispatch.yml@expand-testing
    permissions:
      contents: read
    with:
      checkout_repository: MichaelPesce/orphaned-wells-ui
      checkout_ref: main
      backend_mode: source
      backend_repository: ${{ github.repository }}
      backend_ref: ${{ github.sha }}
    secrets:
      checkout_token: ${{ secrets.CHECKOUT_TOKEN }}
