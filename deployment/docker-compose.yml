services:
  web:
    image: michaelpescelbl/orphaned-wells-ui-server:latest
    env_file:
      - ../ogrre/.env
    environment:
      - STORAGE_SERVICE_KEY=${STORAGE_SERVICE_KEY:-/code/ogrre/storage-service-key.json}
      - DOCUMENT_AI_SERVICE_KEY=${DOCUMENT_AI_SERVICE_KEY:-/code/ogrre/document-ai-service-key.json}
      - LOG_DIR=/logs
    container_name: web
    ports:
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - ./logs:/logs
      - ./secrets/storage-service-key.json:/code/ogrre/storage-service-key.json:ro
      - ./secrets/document-ai-service-key.json:/code/ogrre/document-ai-service-key.json:ro
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "100k"
  
  nginx:
    restart: unless-stopped
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Run compose with --env-file ../ogrre/.env so NGINX_ENV is available here.
      - ./nginx/${NGINX_ENV:-staging}:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    environment:
      - CERTBOT_EMAIL=mpesce@lbl.gov
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "1"
  
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    entrypoint: certbot
